services:
  reverse-proxy:
    image: nginx:1.29-alpine
    container_name: ptitmeet_proxy
    restart: unless-stopped
    depends_on:
      - web
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - ptitmeet_net

  web:
    image: ${GHCR_USERNAME}/ptitmeet-web:${IMAGE_TAG}
    container_name: ptitmeet_web
    restart: unless-stopped
    networks:
      - ptitmeet_net

  backend:
    image: ${GHCR_USERNAME}/ptitmeet-backend:${IMAGE_TAG}
    container_name: ptitmeet_backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PORT: 8080
      JAVA_OPTS: -Xms256m -Xmx768m
    depends_on:
      - redis
    networks:
      - ptitmeet_net

  redis:
    image: redis:7-alpine
    container_name: ptitmeet_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - ptitmeet_net

volumes:
  redis_data:

networks:
  ptitmeet_net:
    driver: bridge
