openapi: 3.1.0
info:
  title: PTITMeet API
  description: API documentation for the PTITMeet backend services.
  contact:
    name: PTITMeet Team
  version: v1
servers:
- url: http://localhost:8080
  description: Local development server
paths:
  /api/users/profile:
    get:
      tags:
      - user-controller
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
    put:
      tags:
      - user-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/meetings/{code}/settings:
    get:
      tags:
      - meeting-controller
      operationId: getSettings
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseString"
    put:
      tags:
      - meeting-controller
      operationId: updateSettings
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeeting"
  /api/users/avatar:
    post:
      tags:
      - user-controller
      operationId: uploadAvatar
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/meetings/{code}/leave:
    post:
      tags:
      - meeting-controller
      operationId: leave
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/meetings/{code}/join:
    post:
      tags:
      - meeting-controller
      operationId: joinMeeting
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinMeetingRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseJoinMeetingResponse"
  /api/meetings/{code}/feedback:
    post:
      tags:
      - meeting-controller
      operationId: submitFeedback
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/meetings/{code}/end:
    post:
      tags:
      - meeting-controller
      operationId: endForAll
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/meetings/{code}/approval:
    post:
      tags:
      - meeting-controller
      operationId: approveParticipant
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/meetings/schedule:
    post:
      tags:
      - meeting-controller
      operationId: schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeeting"
  /api/meetings/instant:
    post:
      tags:
      - meeting-controller
      operationId: createInstant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeeting"
  /api/livekit/webhook:
    post:
      tags:
      - live-kit-webhook-controller
      operationId: handleWebhook
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /api/livekit/recordings/stop:
    post:
      tags:
      - recording-controller
      operationId: stopRecording
      parameters:
      - name: egressId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/livekit/recordings/start:
    post:
      tags:
      - recording-controller
      operationId: startRecording
      parameters:
      - name: meetingCode
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingRecording"
  /api/auth/reset-password:
    post:
      tags:
      - auth-controller
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/auth/refresh-token:
    post:
      tags:
      - auth-controller
      operationId: refreshToken
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
  /api/auth/logout:
    post:
      tags:
      - auth-controller
      operationId: logout
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/auth/login:
    post:
      tags:
      - auth-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
  /api/auth/google:
    post:
      tags:
      - auth-controller
      operationId: loginWithGoogle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAuthResponse"
  /api/auth/forgot-password:
    post:
      tags:
      - auth-controller
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/users/me:
    get:
      tags:
      - user-controller
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseUserResponse"
  /api/meetings/{code}/waiting-room:
    get:
      tags:
      - meeting-controller
      operationId: getWaitingRoom
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListParticipantResponse"
  /api/meetings/{code}/summary:
    get:
      tags:
      - meeting-controller
      operationId: getSummary
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
          default: LEAVE
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingSummaryResponse"
  /api/meetings/{code}/info:
    get:
      tags:
      - meeting-controller
      operationId: getInfo
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingInfoResponse"
  /api/meetings/{code}/chat/history:
    get:
      tags:
      - meeting-controller
      operationId: getChatHistory
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListChatMessage"
  /api/meetings/up-next:
    get:
      tags:
      - meeting-controller
      operationId: getUpNext
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMeetingHistoryResponse"
  /api/meetings/my-meetings:
    get:
      tags:
      - meeting-controller
      operationId: getMyMeetings
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListMeeting"
  /api/meetings/history:
    get:
      tags:
      - meeting-controller
      operationId: getHistory
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 6
      - name: role
        in: query
        required: false
        schema:
          type: string
          default: ALL
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: ALL
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageMeetingHistoryResponse"
  /api/livekit/recordings/status:
    get:
      tags:
      - recording-controller
      operationId: getRecordingStatus
      parameters:
      - name: egressId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/meetings/{code}:
    delete:
      tags:
      - meeting-controller
      operationId: cancel
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 100
          minLength: 2
        avatarUrl:
          type: string
    ApiResponseUserResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
        authProvider:
          type: string
    ApiResponseMeeting:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/Meeting"
    Meeting:
      type: object
      properties:
        meetingId:
          type: string
          format: uuid
        hostId:
          type: string
          format: uuid
        meetingCode:
          type: string
        title:
          type: string
        password:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        allowedDomain:
          type: string
        accessType:
          type: string
          enum:
          - OPEN
          - TRUSTED
          - RESTRICTED
        status:
          type: string
          enum:
          - SCHEDULED
          - ACTIVE
          - FINISHED
          - CANCELED
        settings:
          type: string
        createdAt:
          type: string
          format: date-time
        instant:
          type: boolean
    ApiResponseVoid:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data: {}
    JoinMeetingRequest:
      type: object
      properties:
        password:
          type: string
        displayName:
          type: string
    ApiResponseJoinMeetingResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/JoinMeetingResponse"
    JoinMeetingResponse:
      type: object
      properties:
        token:
          type: string
        serverUrl:
          type: string
        status:
          type: string
        role:
          type: string
        message:
          type: string
        settings:
          type: string
    FeedbackRequest:
      type: object
      properties:
        rating:
          type: integer
          format: int32
    ApprovalRequest:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        action:
          type: string
    CreateMeetingRequest:
      type: object
      properties:
        title:
          type: string
        password:
          type: string
        settings:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        access_type:
          type: string
          enum:
          - OPEN
          - TRUSTED
          - RESTRICTED
        participant_emails:
          type: array
          items:
            type: string
    ApiResponseMeetingRecording:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/MeetingRecording"
    MeetingRecording:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roomName:
          type: string
        egressId:
          type: string
        status:
          type: string
        fileUrl:
          type: string
        createdAt:
          type: string
          format: date-time
    ResetPasswordRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
      - newPassword
      - token
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
        fullName:
          type: string
          maxLength: 100
          minLength: 2
      required:
      - email
      - fullName
      - password
    ApiResponseAuthResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/AuthResponse"
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    GoogleLoginRequest:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
      required:
      - idToken
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ApiResponseListParticipantResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantResponse"
    ParticipantResponse:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
        requestTime:
          type: string
    ApiResponseMeetingSummaryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/MeetingSummaryResponse"
    MeetingSummaryResponse:
      type: object
      properties:
        duration:
          type: string
        participants:
          type: integer
          format: int32
        messages:
          type: integer
          format: int32
    ApiResponseString:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: string
    ApiResponseMeetingInfoResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/MeetingInfoResponse"
    MeetingInfoResponse:
      type: object
      properties:
        title:
          type: string
        status:
          type: string
        passwordProtected:
          type: boolean
        meeting_code:
          type: string
        host_name:
          type: string
        is_password_protected:
          type: boolean
        access_type:
          type: string
          enum:
          - OPEN
          - TRUSTED
          - RESTRICTED
    ApiResponseListChatMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        meetingCode:
          type: string
        senderId:
          type: string
          format: uuid
        senderName:
          type: string
        content:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiResponseMeetingHistoryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/MeetingHistoryResponse"
    MeetingHistoryResponse:
      type: object
      properties:
        meetingCode:
          type: string
        title:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
        host:
          type: boolean
    ApiResponseListMeeting:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
    ApiResponsePageMeetingHistoryResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        data:
          $ref: "#/components/schemas/PageMeetingHistoryResponse"
    PageMeetingHistoryResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/MeetingHistoryResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        pageSize:
          type: integer
          format: int32
        pageNumber:
          type: integer
          format: int32
        paged:
          type: boolean
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
