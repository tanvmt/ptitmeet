name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/ptitmeet-backend
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/ptitmeet-web

jobs:
  build-and-push:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set image tag
        id: meta
        run: echo "image_tag=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/ptitmeet-backend:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/ptitmeet-backend:latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web-client
          build-args: |
            VITE_API_URL=${{ secrets.PROD_VITE_API_URL }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/ptitmeet-web:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.owner.outputs.value }}/ptitmeet-web:latest

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -eu
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "EC2_APP_DIR must point to a cloned ptitmeet repository"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch --all --prune
            git checkout "${{ github.event.workflow_run.head_branch }}"
            git reset --hard "${{ github.event.workflow_run.head_sha }}"
            echo "${{ secrets.EC2_PROD_ENV_FILE }}" > deploy/ec2/.env.prod
            mkdir -p deploy/ec2/nginx
            OWNER_LOWER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
            docker login ghcr.io -u "${{ github.repository_owner }}" -p "${{ secrets.GHCR_READ_TOKEN }}"
            export GHCR_USERNAME="ghcr.io/$OWNER_LOWER"
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            docker compose -f deploy/ec2/docker-compose.prod.yml pull
            docker compose -f deploy/ec2/docker-compose.prod.yml up -d --remove-orphans
